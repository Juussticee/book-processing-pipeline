[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-processor"
version = "0.1.0"
description = "A clean-architecture book processing application with Google Drive sync"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "google-auth",
    "google-api-python-client",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
isort = { known-first-party = ["core", "models", "repositories", "services", "utils", "tests"] }

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
